<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}PDO Client{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

<nav class="navbar">
    <a href="/" class="nav-brand">PDO Client</a>

    <div class="nav-links">
        <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Assets</a>
        <a href="/federated/" {% if '/federated/' in request.path %}class="active"{% endif %}>Federated</a>
        <a href="/wallets/" {% if '/wallets/' in request.path %}class="active"{% endif %}>Wallets</a>
        <a href="/issuers/" {% if '/issuers/' in request.path %}class="active"{% endif %}>Issuers</a>
    </div>

    <div class="nav-right">
        <form method="post" action="{% url 'identity_set' %}" class="nav-identity provision-form">
            {% csrf_token %}
            <label class="nav-identity-label" for="nav-identity-select">Identity:</label>
            <select id="nav-identity-select" name="public_key" class="nav-identity-select"
                    onchange="this.form.requestSubmit()">
                {% if not current_identity %}
                <option value="" selected disabled>Select…</option>
                {% endif %}
                {% if current_identity and current_identity not in available_identities %}
                <option value="{{ current_identity }}" selected>{{ current_identity }}</option>
                {% endif %}
                {% for name in available_identities %}
                <option value="{{ name }}" {% if name == current_identity %}selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
        </form>
        <a href="/config/" class="nav-settings-link" title="Settings">&#9881;</a>
    </div>
</nav>

<!-- Progress modal: reused by any multi-step flow (identity provisioning, asset
     register / expose / use) to show live per-step progress. Driven by
     window.progress (static/js/progress.js). -->
<div id="progress-modal" class="modal-backdrop hidden">
    <div class="modal" style="max-width:460px">
        <div class="modal-header">
            <span class="modal-title" id="progress-title">Working…</span>
        </div>
        <ul class="progress-steps" id="progress-steps"></ul>
        <div class="form-actions">
            <button type="button" class="btn" id="progress-close"
                    data-modal-close="progress-modal" style="display:none">Close</button>
        </div>
    </div>
</div>

{% block content %}{% endblock %}

<script src="/static/js/client.js"></script>
<script src="/static/js/modals.js"></script>
<script src="/static/js/flash.js"></script>
<script src="/static/js/copy.js"></script>
<script src="/static/js/progress.js"></script>
<script src="/static/js/provision.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
