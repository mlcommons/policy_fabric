{% extends "base.html" %}
{% block title %}Configuration — PDO Client{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1 class="page-title">Configuration</h1>
        </div>
    </div>

    <div class="card card-narrow">
        <form method="post" class="provision-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_public_key">Public Key / Username</label>
                <input type="text" id="id_public_key" name="public_key" value="{{ config.public_key }}"
                    placeholder="e.g. alice" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Configuration</button>
                {% if config.is_configured %}
                <a href="/" class="btn">Back to Assets</a>
                {% endif %}
            </div>
        </form>
    </div>
</div>
{% endblock %}
