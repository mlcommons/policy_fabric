<!-- A card's README and rule; opened by window.render.showCard. -->
<div id="card-detail-modal" class="modal-backdrop hidden">
    <div class="modal card-detail-modal" style="max-width:860px">
        <div class="modal-header">
            <span class="modal-title" id="card-detail-title">Card</span>
            <button type="button" class="modal-close"
                    data-modal-close="card-detail-modal">&times;</button>
        </div>
        <div class="tabs">
            <button type="button" class="tab-btn active" data-card-tab="readme">Overview</button>
            <button type="button" class="tab-btn" data-card-tab="rego">Rule</button>
        </div>
        <div class="tab-panel active" data-card-panel="readme">
            <div class="markdown-body" id="card-detail-readme"></div>
        </div>
        <div class="tab-panel" data-card-panel="rego">
            <pre class="code-viewer"><code class="rego-code" id="card-detail-rego"></code></pre>
        </div>
    </div>
</div>
