name: Registry security tests
on:
  pull_request:
    paths:
      - 'tools/asset_registry/**'
      - 'tools/template_registry/**'
      - 'tools/pdo_client/webapp/app/registry_client.py'
      - 'tools/pdo_client/webapp/config/settings.py'
      - 'tools/tests/test_service_security.py'
      - '.github/workflows/registry-security.yml'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'Django~=5.2.19' requests
      - run: python tools/asset_registry/manage.py test app
        env:
          DJANGO_SECRET_KEY: test-only-ci-key
      - run: python tools/template_registry/manage.py test app
        env:
          DJANGO_SECRET_KEY: test-only-ci-key
      - run: python -m unittest discover -s tools/tests -p test_service_security.py
