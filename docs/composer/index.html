<!doctype html>
<html lang="en" class="pf-graph">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy Composer</title>
<link rel="stylesheet" href="policy_ui/policy_graph.css">
<link rel="stylesheet" href="composer.css">
<script src="theme.js"></script>
</head>
<body>
<!-- Layout: one-screen workbench. Component library | canvas, legend and a results tray | side panel (accept-presented switches, or the simulation settings). Stacks to one column on phones. -->
<div class="app">
  <header class="topbar">
    <div class="brand"><small>Policy Fabric</small><strong>Policy Composer</strong></div>
    <div class="card-field">
      <label for="card-name">Card</label>
      <input id="card-name" type="text" autocomplete="off" spellcheck="false">
    </div>
    <div class="bar-actions">
      <label for="load-select">Load</label>
      <select id="load-select">
        <option value="">Choose a starting point…</option>
      </select>
      <input id="load-file" type="file" accept=".json,application/json" hidden>
      <button type="button" class="bar-btn" id="download" title="Download the graph.json of this card">Download</button>
    </div>
  </header>

  <div class="workbench">
    <aside class="panel library" aria-label="Component library">
      <div class="lib-head">
        <h2>Components</h2>
        <input id="lib-search" type="search" placeholder="Filter by name or credential" aria-label="Filter components">
      </div>
      <div class="lib-list" id="lib-list"></div>
      <div class="lib-foot">Click a component to see its inputs, output and Rego. Add puts it on the canvas; dragging it there works too.</div>
    </aside>

    <main class="stage">
      <div class="canvas" id="canvas" tabindex="0" aria-label="Policy graph canvas">
        <div class="world" id="world">
          <svg class="wires" id="wires" aria-hidden="true"></svg>
          <div id="nodes"></div>
          <div id="wire-tools"></div>
        </div>
        <div class="canvas-hint" id="canvas-hint">Loading the components…</div>
        <div class="banner" id="banner" hidden></div>
        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
        <div class="zoom">
          <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
          <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" id="arrange" class="wide" title="Lay the components out from left to right">Arrange</button>
          <button type="button" id="zoom-fit" class="wide">Fit</button>
        </div>
      </div>
      <div class="legend-box" id="legend" aria-label="Legend"></div>

      <section class="panel tray" aria-label="Results">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-checks" data-tab="checks" aria-controls="tray-body">Checks <span class="count" id="count-checks">0</span></button>
          <button class="tab" role="tab" id="tab-sim" data-tab="sim" aria-controls="tray-body">Simulate <span class="tag">preview</span></button>
          <button class="tab" role="tab" id="tab-json" data-tab="json" aria-controls="tray-body">Graph JSON</button>
        </div>
        <div class="tray-body" id="tray-body" role="tabpanel"></div>
      </section>
    </main>

    <aside class="side" id="side" aria-label="Settings"></aside>
  </div>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
</div>

<script src="policy_ui/policy_graph.js"></script>
<script src="issuers.js"></script>
<script src="composer.js"></script>
</body>
</html>
